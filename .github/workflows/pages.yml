name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# デプロイの同時実行は避けるが、進行中のデプロイは中断しない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate external pages data
        env:
          # リポジトリ一覧の取得にのみ使う。公開情報なので自リポジトリに限定された
          # GITHUB_TOKEN で足りる（Pages の生存確認は認証不要な HTTP プローブで行う）。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash script/gen-external-pages.sh

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # GitHub Pages 本番のビルド環境に合わせる。
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
          # レイアウトが参照する site.github.* を解決するために必要。
          # 未設定だと CSS の参照やヘッダ/フッタが壊れる。
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGES_REPO_NWO: ${{ github.repository }}
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
